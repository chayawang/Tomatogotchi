name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Full verification
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public source hygiene
        run: python3 scripts/check-public-source.py
      - name: Complete isolated verification
        run: bash scripts/verify.sh
      - name: Show failed validation logs
        if: failure()
        run: |
          for log in .build/validation-*.log; do
            test ! -f "$log" || tail -80 "$log"
          done
